# [INPUT]: 依赖 /opt/infinite-home 下的 home.html 与 assets 静态资源
# [OUTPUT]: 对外提供 infinite.okethan.com 的 HTTPS 静态站点与 HTTP 301 跳转
# [POS]: deploy 模块的生产 Nginx 虚拟主机配置，TLS 证书由 Certbot 自动续期
# [PROTOCOL]: 变更时更新此头部，然后检查 AGENTS.md

server {
    server_name infinite.okethan.com;

    root /opt/infinite-home;
    index home.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /home.html;
    }

    location ~* \.(?:webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/infinite.okethan.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/infinite.okethan.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = infinite.okethan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name infinite.okethan.com;
    return 404; # managed by Certbot
}
